name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check & build
        working-directory: frontend
        run: npm run build
      - name: Unit tests (vitest)
        working-directory: frontend
        run: npm test
      - name: Upload frontend build (for go:embed)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  backend:
    runs-on: ubuntu-latest
    needs: frontend
    env:
      # Wails v3 Linux builds are cgo: the default path targets GTK4 (tag `linux && cgo`),
      # `-tags gtk3` selects the GTK3 + WebKit2GTK-4.1 API (supported through the v3.0.x
      # line). Job-level GOFLAGS covers go build / go test AND golangci-lint compilation.
      GOFLAGS: -tags=gtk3
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install GTK / WebKit development packages
        # Wails v3 Linux build is cgo; the gtk3 tag compiles against WebKit2GTK 4.1
        # (ubuntu-latest = 24.04 ships libwebkit2gtk-4.1-dev; gcc/pkg-config preinstalled).
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build
        run: go build ./...
      - name: Unit tests (Go)
        run: go test ./...
      - name: Restore e2e assets (llama.cpp cpu build + tiny model)
        # Pinned llama.cpp build (b10695) CPU binary + the ~2 MB tinyllamas
        # stories260K GGUF feed TestServiceChainE2E: the real model-scan ->
        # preset -> spawn -> OpenAI API -> stop pipeline on each build OS.
        # Cached across runs; bump the key (and the pin) when refreshing.
        uses: actions/cache@v4
        with:
          path: .e2e-cache
          key: e2e-assets-llama-b10695-stories260K-${{ runner.os }}
      - name: Fetch e2e assets
        run: |
          set -euo pipefail
          mkdir -p .e2e-cache/llamacpp
          if [ ! -f .e2e-cache/llamacpp/llama-server ]; then
            # libvulkan is a runtime dependency of the ubuntu llama.cpp build
            # (it degrades to CPU without a GPU but needs the loader present).
            sudo apt-get install -y libvulkan1
            curl -fL --retry 3 -o /tmp/llamacpp.tar.gz \
              "https://github.com/ggml-org/llama.cpp/releases/download/b10695/llama-b10695-bin-ubuntu-x64.tar.gz"
            mkdir -p /tmp/llamacpp-unpack
            tar -xzf /tmp/llamacpp.tar.gz -C /tmp/llamacpp-unpack
            # Ship the WHOLE extracted dir: llama-server needs its sibling
            # libllama-server-impl / libggml libraries (.so on linux) — a
            # lone binary dies on the loader (cannot open shared object file).
            SERVER_DIR="$(dirname "$(find /tmp/llamacpp-unpack -name llama-server -type f | head -1)")"
            cp -R "$SERVER_DIR"/. .e2e-cache/llamacpp/
          fi
          if [ ! -f .e2e-cache/stories260K.gguf ]; then
            curl -fL --retry 3 -o .e2e-cache/stories260K.gguf \
              "https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf"
          fi
          test -f .e2e-cache/llamacpp/llama-server
          test -f .e2e-cache/stories260K.gguf
      - name: llama.cpp API contract shape probe (informational only)
        # Boots the e2e llama-server once in router mode (models preset, same
        # start shape as the app's buildServerCommand) and logs three contract
        # lines before the e2e steps, so a future pin bump surfaces HTTP
        # contract drift explicitly in the job log. Deliberately NO `set -e` and
        # `exit 0` at the end: the probe never affects the job outcome — the e2e
        # assertions below remain the only pass conditions.
        #
        # Pin-bump checklist (verify against upstream tools/server sources when
        # changing the cache key + download URLs in backend / build-windows):
        #   1. GET /models (router preset mode) still carries per-entry
        #      status:{value,args} — core/router.go parseModelsBody's router
        #      shape and the loaded/loading/sleeping filter depend on it.
        #   2. POST /models/unload {"model":<id>} still unloads a loaded model
        #      (200 {"success":true} at b10342/b10695). A 404 means the route
        #      vanished/moved: core/router.go unloadRouterModel would then
        #      misreport ROUTER mode as direct mode (guided "stop the service").
        #   3. GET /v1/models still lists the served models (it is
        #      fetchRouterModels' direct-mode 404 fallback target; router mode
        #      currently answers it with the same listing as /models).
        shell: bash
        run: |
          srv=""
          for c in .e2e-cache/llamacpp/llama-server .e2e-cache/llamacpp/llama-server.exe; do
            if [ -f "$c" ]; then srv="$c"; break; fi
          done
          if [ -z "$srv" ]; then
            echo "[contract-probe] llama-server binary not found in .e2e-cache; skipping"
            exit 0
          fi
          port=$((20000 + RANDOM % 20000))
          gguf="$(pwd)/.e2e-cache/stories260K.gguf"
          preset="$(pwd)/.e2e-cache/contract-probe.ini"
          # Native llama-server on the Windows runner cannot read MSYS-style
          # paths: convert to drive-letter form (forward slashes are fine).
          # MUST run before the preset INI is written below — the INI embeds
          # the model path verbatim.
          if command -v cygpath >/dev/null 2>&1; then
            gguf="$(cygpath -m "$gguf")"
            preset="$(cygpath -m "$preset")"
          fi
          printf '[stories260K]\nmodel = %s\n\n' "$gguf" > "$preset"
          "$srv" --version | head -1
          "$srv" --host 127.0.0.1 --port "$port" --models-preset "$preset" --no-webui \
            > .e2e-cache/contract-probe-server.log 2>&1 &
          srvpid=$!
          body=""
          for i in $(seq 1 30); do
            body="$(curl -s --max-time 2 "http://127.0.0.1:$port/models" || true)"
            # Ready gate: the preset-registered id must be listed — the server
            # can answer /models with an early non-listing body mid-startup.
            if printf '%s' "$body" | grep -q 'stories260K'; then break; fi
            body=""
            sleep 1
          done
          if [ -n "$body" ]; then
            # created-timestamps differ per server start: blank them so the
            # hash reflects the response SHAPE, not the start time.
            stable="$(printf '%s' "$body" | sed -E 's/"created":[0-9]+/"created":0/g')"
            models_hash="$(printf '%s' "$stable" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -c1-12)"
            echo "[contract-probe] GET /models body sha256(first12) = $models_hash"
            if printf '%s' "$body" | grep -q '"status"'; then
              echo '[contract-probe] GET /models contains "status": true'
            else
              echo '[contract-probe] GET /models contains "status": false'
            fi
            # Prime the model into memory first, so the unload probe measures
            # the real loaded-model contract (200 {"success":true} at the
            # pinned builds; 400 "model is not running" when not loaded).
            curl -s --max-time 60 -o /dev/null -X POST -H 'Content-Type: application/json' \
              -d '{"model":"stories260K","messages":[{"role":"user","content":"hi"}],"max_tokens":1}' \
              "http://127.0.0.1:$port/v1/chat/completions" || true
            unload_code="$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
              -d '{"model":"stories260K"}' "http://127.0.0.1:$port/models/unload" || true)"
            echo "[contract-probe] POST /models/unload (loaded model) status = $unload_code"
          else
            echo "[contract-probe] server did not answer /models within 30s; shape probes skipped"
          fi
          kill "$srvpid" 2>/dev/null || true
          wait "$srvpid" 2>/dev/null || true
          rm -f "$preset" .e2e-cache/contract-probe-server.log
          exit 0
      - name: Service-chain E2E (real llama-server + tiny model)
        env:
          LLAMA_DESKTOP_E2E: "1"
          LLAMA_DESKTOP_E2E_LLAMA_SERVER: ${{ github.workspace }}/.e2e-cache/llamacpp
          LLAMA_DESKTOP_E2E_MODEL: ${{ github.workspace }}/.e2e-cache/stories260K.gguf
        run: go test ./core/ -run TestServiceChainE2E -count=1 -timeout 10m -v
      - name: Service-chain E2E (direct mode, Android start path)
        # Exercises the Android direct-mode start path on a real llama-server: the desktop (ubuntu) binary is fine because the test pins the in-test platformGOOS seam to "android" (-m/--alias start, /models 404 -> /v1/models fallback, completion, stop).
        env:
          LLAMA_DESKTOP_E2E: "1"
          LLAMA_DESKTOP_E2E_MODE: direct
          LLAMA_DESKTOP_E2E_LLAMA_SERVER: ${{ github.workspace }}/.e2e-cache/llamacpp
          LLAMA_DESKTOP_E2E_MODEL: ${{ github.workspace }}/.e2e-cache/stories260K.gguf
        run: go test ./core -run 'TestServiceChainE2EDirect' -count=1 -v
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install wails3 CLI (pinned to the go.mod v3 version)
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
      - name: Install NSIS (makensis, invoked directly on the installer template)
        run: choco install nsis -y --no-progress
      - name: Add makensis to PATH
        shell: pwsh
        run: |
          # choco only updates registry PATH; the current job's process environment does not auto-refresh,
          # dynamically locate makensis and write to $GITHUB_PATH for subsequent steps
          $mk = Get-ChildItem "$env:ProgramFiles", "${env:ProgramFiles(x86)}" `
            -Filter makensis.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $mk) { throw 'makensis.exe not found after "choco install nsis"' }
          Write-Host "Found makensis: $($mk.FullName)"
          Add-Content $env:GITHUB_PATH $mk.DirectoryName
      - name: Sync version file from tag
        # Release version uses git tag as sole source: push v* tag writes tag to
        # core/VERSION (embedded at compile time), ensuring in-app version matches release.
        # Non-tag builds (regular push / manual trigger) use repo's core/VERSION default.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "$GITHUB_REF_NAME" > core/VERSION
      - name: Build Windows app (exe via wails3 task build)
        # Repo-root Taskfile.yml `build` task = bindings + frontend + go build; the
        # tag→core/VERSION sync above feeds the embedded version. generate:bindings
        # inside the task runs `go mod tidy` (harmless).
        run: wails3 task build
      - name: Unit tests on the target OS (windows-specific branches)
        # The backend job only ever exercises linux code paths; windows-latest
        # runs the same suite against the windows branches (proctime, tray,
        # crossdevice, hidewindow, paths fallbacks). Runs after the build task
        # so frontend/dist (go:embed dependency) exists.
        run: go test ./...
      - name: Restore e2e assets (llama.cpp cpu build + tiny model)
        uses: actions/cache@v4
        with:
          path: .e2e-cache
          key: e2e-assets-llama-b10695-stories260K-${{ runner.os }}
      - name: Fetch e2e assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .e2e-cache/llamacpp | Out-Null
          if (-not (Test-Path .e2e-cache/llamacpp/llama-server.exe)) {
            Invoke-WebRequest -Uri 'https://github.com/ggml-org/llama.cpp/releases/download/b10695/llama-b10695-bin-win-cpu-x64.zip' -OutFile .e2e-cache/llamacpp.zip
            Expand-Archive .e2e-cache/llamacpp.zip -DestinationPath .e2e-cache/unpack -Force
            # Ship the WHOLE extracted tree: llama-server.exe needs its sibling
            # ggml DLLs (a lone exe dies instantly with 0xc0000135).
            $exe = Get-ChildItem .e2e-cache/unpack -Recurse -Filter llama-server.exe | Select-Object -First 1
            if (-not $exe) { throw 'llama-server.exe not found in the release zip' }
            Copy-Item (Join-Path $exe.DirectoryName '*') .e2e-cache/llamacpp/ -Force
          }
          if (-not (Test-Path .e2e-cache/stories260K.gguf)) {
            Invoke-WebRequest -Uri 'https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf' -OutFile .e2e-cache/stories260K.gguf
          }
      - name: Service-chain E2E (real llama-server + tiny model)
        env:
          LLAMA_DESKTOP_E2E: "1"
          LLAMA_DESKTOP_E2E_LLAMA_SERVER: ${{ github.workspace }}/.e2e-cache/llamacpp
          LLAMA_DESKTOP_E2E_MODEL: ${{ github.workspace }}/.e2e-cache/stories260K.gguf
        run: go test ./core/ -run TestServiceChainE2E -count=1 -timeout 10m -v
      - name: Download WebView2 bootstrapper
        # project.nsi's wails.webview2runtime macro embeds tmp/MicrosoftEdgeWebview2Setup.exe.
        # The v2 CLI used to unpack it from its own binary during `wails build -nsis`; with
        # makensis-direct we fetch Microsoft's Evergreen bootstrapper (permanent fwlink).
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows/installer/tmp | Out-Null
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2124703' -OutFile 'build/windows/installer/tmp/MicrosoftEdgeWebview2Setup.exe'
      - name: Build NSIS installer (makensis directly on build/windows/installer/project.nsi)
        # The committed wails_tools.nsh carries the installer metadata defaults; the product
        # version is overridden from the tag (or core/VERSION on non-tag builds) via -D, since
        # VIProductVersion requires a 4-part numeric version (hence stripping the leading "v").
        # makensis runs from the installer dir, mirroring the template's documented standalone
        # usage so all relative paths resolve there: the NSIS `..\..\bin\` paths climb two
        # levels to build\bin (that is how the v2 template was written), while core/VERSION
        # sits at the repo root — THREE levels up from build/windows/installer.
        working-directory: build/windows/installer
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="$GITHUB_REF_NAME"; else VER="$(cat ../../../core/VERSION)"; fi
          echo "ARTIFACT_VERSION=$VER" >> "$GITHUB_ENV"
          makensis -DARG_WAILS_AMD64_BINARY='..\..\bin\MyLlama.exe' -DINFO_PRODUCTVERSION="${VER#v}" project.nsi
      - name: Rename artifacts with version
        shell: bash
        run: |
          # ARTIFACT_VERSION was resolved in the installer step: tag build uses the tag
          # (e.g. v0.1.6); non-tag builds fall back to core/VERSION.
          mv build/bin/MyLlama-amd64-installer.exe "build/bin/MyLlama-setup-${ARTIFACT_VERSION}-windows-amd64.exe"
          ls -la build/bin/
      - name: List build outputs
        shell: bash
        run: ls -la build/bin/
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyLlama-windows
          path: |
            build/bin/MyLlama-setup-*.exe

  build-linux:
    # Build Ubuntu 22.04 / 24.04 .deb packages with the Wails v3 GTK3 stack.
    # 20.04 was dropped from the old v2-era matrix: Wails v3 has no webkit2gtk-4.0 path at
    # all — the gtk3 tag hard-compiles against pkg-config "webkit2gtk-4.1 libsoup-3.0"
    # (v3 internal/assetserver/webview/*_linux_gtk3.go) and the default path targets
    # "gtk4 webkitgtk-6.0"; Ubuntu 20.04 (focal) ships neither (libwebkit2gtk-4.0-dev
    # exposes only the webkit2gtk-4.0 pc file and soup 2.x). The old webkit2_36 /
    # webkit2_41 build tags are v2-era and do not exist in v3, so a focal build is
    # impossible under v3 rather than merely needing fallback tags.
    # Note: GitHub-hosted ubuntu-20.04 runner is retired; each distro builds in its own
    # ubuntu container for consistent binary / glibc / dependency versions.
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      matrix:
        include:
          - os: "22.04"
            container: ubuntu:22.04
            webkit-runtime: libwebkit2gtk-4.1-0
          - os: "24.04"
            container: ubuntu:24.04
            webkit-runtime: libwebkit2gtk-4.1-0
    container: ${{ matrix.container }}
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
    steps:
      - name: Bootstrap Node 20 in container
        # Container image does not preinstall node, but actions/* (checkout / setup-go /
        # artifact) need node runtime; first step must be pure-run Node bootstrap
        # (NodeSource node 20), then actions can be used.
        run: |
          apt-get update
          apt-get install -y ca-certificates curl gnupg
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          node --version

      - uses: actions/checkout@v4

      - name: Download frontend build
        # Reuse frontend job's frontend/dist (go:embed compile dependency), Linux build skips npm
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install GTK / WebKit development packages
        # Wails v3 Linux build is cgo: -tags gtk3 selects the GTK3 + WebKit2GTK 4.1 API
        # (same stack the backend job compiles on ubuntu-latest); the dev package name is
        # identical on 22.04 / 24.04, the runtime package is resolved per distro in control.
        run: |
          apt-get update
          apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Sync version file from tag
        # Same logic as windows job: release version uses git tag as sole source, push v* tag
        # writes core/VERSION (embedded at compile time); non-tag build uses repo default
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "$GITHUB_REF_NAME" > core/VERSION

      - name: Build Linux app
        # Direct go build (go:embed embeds frontend/dist), no wails CLI / npm;
        # -tags production,gtk3 is the v3 production build for the GTK3 + WebKit2GTK 4.1
        # stack; CGO is required (webview via cgo) and stated explicitly.
        run: CGO_ENABLED=1 go build -tags "production,gtk3" -trimpath -buildvcs=false -ldflags="-w -s" -o build/bin/MyLlama .

      - name: Package .deb
        # Hand-rolled dpkg-deb layout (mirrors the v3 nfpm template's file placement):
        # /usr/local/bin binary, /usr/share/applications .desktop entry, icon under
        # /usr/share/icons/hicolor/<size>/apps. The distro is embedded in the deb Version
        # revision (e.g. 0.3.9-ubuntu22.04) so parallel-installed per-distro packages and
        # their filenames are distinguishable.
        run: |
          # Version source matches windows job: tag build uses tag (e.g. v0.1.6);
          # non-tag build falls back to core/VERSION. deb Version field must not have v prefix.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="$GITHUB_REF_NAME"
          else
            VER="$(cat core/VERSION)"
          fi
          DEBVER="${VER#v}-ubuntu${{ matrix.os }}"

          # Assemble pkg/ directory layout: DEBIAN/control + binary + desktop entry + icon
          mkdir -p pkg/DEBIAN pkg/usr/local/bin pkg/usr/share/applications

          # Depends uses alternatives to cover the 24.04 time64 transition gtk3 rename
          # (libgtk-3-0 -> libgtk-3-0t64); WebKit runtime per distro matrix
          cat > pkg/DEBIAN/control <<EOF
          Package: myllama
          Version: ${DEBVER}
          Section: utils
          Architecture: amd64
          Maintainer: CodeNeow
          Description: Local LLM desktop manager powered by llama.cpp
          Depends: libgtk-3-0 | libgtk-3-0t64, ${{ matrix.webkit-runtime }}
          EOF

          cp build/bin/MyLlama pkg/usr/local/bin/myllama

          cat > pkg/usr/share/applications/myllama.desktop <<EOF
          [Desktop Entry]
          Version=1.0
          Name=MyLlama
          Comment=Local LLM desktop manager powered by llama.cpp
          Exec=/usr/local/bin/myllama %u
          Terminal=false
          Type=Application
          Icon=myllama
          Categories=Utility;
          StartupWMClass=myllama
          EOF

          # Include app icon when build/appicon.png exists; omit otherwise.
          # build/appicon.png is 512x512, so it ships under hicolor/512x512 (the size
          # directory must match the actual image size per the freedesktop icon spec).
          if [[ -f build/appicon.png ]]; then
            mkdir -p pkg/usr/share/icons/hicolor/512x512/apps
            cp build/appicon.png pkg/usr/share/icons/hicolor/512x512/apps/myllama.png
          fi

          dpkg-deb --build --root-owner-group pkg
          mv pkg.deb "build/bin/myllama_${DEBVER}_amd64.deb"
          ls -la build/bin/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyLlama-linux-${{ matrix.os }}
          path: build/bin/myllama_*.deb

  build-android:
    # arm64 APK via the Wails v3 Android gradle project in build/android
    # (go shared lib -> jniLibs -> gradle assembleRelease), signed with the
    # STABLE release keystore restored from Actions secrets (restore step
    # below): Android only lets an APK replace an installed one with the same
    # signature, so the in-app self-update (PackageInstaller) needs every
    # release APK to share one stable signature. Without the secrets (fork
    # PRs) the build degrades to the per-runner debug keystore with a warning.
    # Sideload / GitHub-release distribution only: targetSdk is deliberately 28
    # (see build/android/app/build.gradle) so the app may exec the
    # runtime-downloaded llama-server binary, while Play requires targetSdk
    # >= 34.
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend build
        # Reuse frontend job's frontend/dist (go:embed compile dependency),
        # Android build skips npm
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install wails3 CLI (Taskfile runner, pinned to the go.mod v3 version)
        # Only `wails3 task` is used here; the Android Go build itself is a
        # plain `go build -buildmode=c-shared` (no wails3 codegen step).
        run: CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
      - name: Install Android NDK + platform 35
        # ubuntu-latest ships ANDROID_HOME with platform-tools and recent
        # build-tools, but not necessarily the NDK this project pins or
        # platforms;android-35. NDK 26.3.11579264 is the version the v3
        # beta.16 template/ANDROID.md expects (r26+/26.3.x).
        run: |
          # sdkmanager is not on PATH; cmdline-tools/latest ships with the runner image.
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "ndk;26.3.11579264" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore stable release keystore from Actions secrets
        # ANDROID_KEYSTORE_BASE64 (the keystore file, base64) plus
        # ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
        # make every released APK share one stable signature, which the
        # Android in-app self-update requires (same-signature install check).
        # The build.gradle picks the vars up via ANDROID_KEYSTORE_* env;
        # base64 round-trips the binary keystore through the secret store.
        # Secrets are unavailable to fork PRs: warn and fall back to the
        # per-runner debug keystore (install-once APK, not in-app-updatable).
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set - the arm64 APK falls back to the per-runner debug keystore (not in-app-updatable)"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/myllama-release.keystore"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/myllama-release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"
      - name: Sync version file from tag
        # Same logic as windows/linux jobs: release version uses git tag
        # as sole source; non-tag build uses repo default. android:package
        # reads core/VERSION for the artifact filename (and gradle
        # versionName/versionCode injection happens inside the Taskfile task).
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "$GITHUB_REF_NAME" > core/VERSION
      - name: Build Android APK (go shared lib + gradle assembleRelease)
        # android:package deps android:build deps android:build:go: NDK clang
        # c-shared build of libwails.so into jniLibs/arm64-v8a, then gradle
        # assembleRelease (SDK resolved from the runner's ANDROID_HOME;
        # signing from the stable keystore restored above, versionName /
        # versionCode derived from core/VERSION inside the task).
        run: wails3 task android:package
      - name: Build x86_64 smoke APK (CI-emulator only, not released)
        # CI's Android emulator is x86_64 and cannot run arm64 native libs, so
        # the smoke job needs a second debug APK carrying an x86_64 libwails.so
        # (Taskfile android:build:go ABI=x86_64 + gradle -PtargetAbi=x86_64).
        # Uploaded under its own artifact name (outside the MyLlama-*
        # release pattern) so the release job's 4-artifact count stays intact.
        run: |
          wails3 task android:build:go ABI=x86_64
          cd build/android
          chmod +x ./gradlew
          ./gradlew -PtargetAbi=x86_64 assembleDebug
          VER="$(cat ../../core/VERSION)"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "../../build/bin/MyLlama-${VER}-android-x86_64-debug-smoke.apk"
      - name: Upload smoke APK
        uses: actions/upload-artifact@v4
        with:
          name: smoke-android-apk
          path: build/bin/MyLlama-*-android-x86_64-debug-smoke.apk
      - name: List build outputs
        run: ls -la build/bin/
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyLlama-android
          path: build/bin/MyLlama-*-android-arm64.apk

  smoke-android:
    # Emulator smoke for the APK: boots the x86_64 debug build on an API 30
    # emulator and asserts the app reaches a running state without crashing —
    # the Go/JNI runtime, the storage-anchor resolution and the WebView
    # frontend boot path that no desktop CI can exercise. Full business
    # chains (model download -> inference) stay on real-device validation:
    # the emulator cannot exec the runtime-downloaded llama-server comfortably
    # nor offer representative storage/performance conditions.
    runs-on: ubuntu-latest
    needs: build-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: smoke-android-apk
          path: apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and smoke-test the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          # The logic lives in scripts/android_smoke.sh: the action's single
          # `script` input has proven newline-fragile (a multiline loop was
          # flattened to one line and dash died parsing it).
          script: bash scripts/android_smoke.sh
      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-android-screen
          path: emulator-screen.png
          if-no-files-found: ignore

  release:
    # Centralized release to avoid build-windows / build-linux / build-android
    # jobs competing to create the same Release. Tag push publishes a formal Release, workflow_dispatch
    # publishes a draft preview. Expected release artifacts: 1 windows exe installer
    # + 2 ubuntu debs (22.04 / 24.04; 20.04 dropped, see build-linux)
    # + 1 android arm64 apk = 4.
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-android]
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      # Checkout brings in CHANGELOG.md, the authoritative release-notes source read by the
      # extraction step below (this job originally ran without a repo checkout).
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        # Exclude frontend-dist by pattern, only pull release artifacts and merge into one directory:
        # windows 1 exe + linux 2 deb (ubuntu 22.04 / 24.04) + android 1 apk
        uses: actions/download-artifact@v4
        with:
          pattern: MyLlama-*
          path: artifacts
          merge-multiple: true
      - name: Purge non-release APKs (smoke / debug builds)
        # Belt-and-suspenders: the download pattern (MyLlama-*) already excludes
        # the smoke-android-apk artifact, but if a future rename ever lets a
        # smoke / debug APK into artifacts/, purge it here so it can never be
        # attached to a Release. The 4-artifact count check below still fails
        # on any UNEXPECTED extra file.
        run: rm -f artifacts/*smoke*.apk artifacts/*debug*.apk
      - name: Extract release notes from CHANGELOG.md
        # This repo commits directly to main with no PRs, so --generate-notes only aggregates a
        # bare "Full Changelog" compare link. The authoritative notes live in CHANGELOG.md:
        # extract the tagged version's section (from its '## [vX.Y.Z]' heading, exclusive, up to
        # the next '## [v' heading, exclusive) keeping the bilingual '## 中文' / '## English'
        # subsections that the in-app update modal parses.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          # Literal heading match via index() (no regex on the tag name): avoid surprises from
          # characters a tag name could theoretically contain.
          awk -v target="## [$GITHUB_REF_NAME]" '
            /^## \[v/ {
              if (target_found) { exit }
              if ($0 == target || index($0, target" ") == 1) { target_found = 1 }
              next
            }
            target_found { print }
          ' CHANGELOG.md \
            | sed '/./,$!d' > release-notes.md
          # A tag without a CHANGELOG entry would publish an empty Release body — abort instead.
          if [[ ! -s release-notes.md ]]; then
            echo "::error::No CHANGELOG.md entry found for $GITHUB_REF_NAME (expected a '## [$GITHUB_REF_NAME]' heading); add the entry before tagging."
            exit 1
          fi
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Validate artifact count must be 4 (windows 1 exe; linux 2 deb: ubuntu 22.04
          # + 24.04; android 1 arm64 apk), fail if missing
          # to avoid incomplete Release
          shopt -s nullglob
          files=(artifacts/*)
          shopt -u nullglob
          [[ ${#files[@]} -eq 4 ]] || { echo "Expected 4 artifacts, found ${#files[@]}"; exit 1; }
          for f in "${files[@]}"; do
            [[ -f "$f" ]] || { echo "Missing artifact: $f"; exit 1; }
          done
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Push v* tag: publish formal Release. Notes come from CHANGELOG.md (extracted above),
            # not --generate-notes: PR-less direct-to-main repo makes auto-generated notes useless.
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            # Manual trigger: create draft Release (draft does not affect formal version)
            gh release create "preview-$GITHUB_RUN_ID" "${files[@]}" \
              --draft --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
