name: "Bug Report"
description: "Unexpected behavior encountered during use. For filing everyday bugs."
title: "[Bug] Brief description"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in as much information as possible to help us investigate quickly.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the behavior you observed and what you expected to happen instead.
      placeholder: "I saw …, but I expected …"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction Steps
      placeholder: |
        1.
        2.
        3.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Frontend
        - Backend
        - Model Management / Scanning
        - Model Download (HF Mirror)
        - API Service / llama-server
        - llama.cpp Installation / Download
        - Configuration / Theme
        - Other
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Operating system and version, model file (GGUF name), llama.cpp version, service port, reproduction frequency.
      placeholder: "Windows 11 / qwen2.5-7b-instruct-q4_k_m.gguf / llama.cpp b4466 / always reproducible"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Screenshots / Logs
      description: If you have UI screenshots, API page service logs, or error messages, please attach them. **Redact sensitive information first** (`myllama-config.json` may contain machine-specific paths).
    validations:
      required: false

  - type: checkboxes
    id: sanitized
    attributes:
      label: Redaction Confirmation
      options:
        - label: I confirm this issue contains no tokens, secrets, machine-specific absolute paths, or other sensitive information
          required: true
