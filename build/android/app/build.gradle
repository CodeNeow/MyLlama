// MyLlama Android app module.
// Adapted from the Wails v3.0.0-beta.16 template
// (v3/internal/commands/build_assets/android/app/build.gradle), with these
// changes:
//   - namespace / applicationId -> com.codeneow.llamadesktop (the Java
//     sources stay in the com.wails.app package because the Wails v3 Go
//     runtime hardcodes the JNI export symbols as
//     Java_com_wails_app_WailsBridge_*; see the imports added in
//     MainActivity / WailsBridge / WailsJSBridge / WailsPathHandler and the
//     fully-qualified component names in AndroidManifest.xml).
//   - targetSdk 28 (see the comment in defaultConfig below).
//   - versionName / versionCode injected from core/VERSION via -P
//     properties (fallback 0.3.9 / 1 for bare gradlew runs).
//   - arm64-v8a only (CI ships a single arm64 APK).
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.codeneow.llamadesktop'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.codeneow.llamadesktop"
        minSdk 21
        // targetSdk 28 is a deliberate choice for this sideload-only app:
        // Android 10 (API 29) blocks exec() of binaries stored in app-writable
        // directories for apps targeting API 29+, and MyLlama MUST exec
        // the llama-server engine that it downloads at runtime from upstream
        // releases (full desktop parity — the engine is not bundled in the
        // APK). targetSdk 28 keeps the W^X exemption for app-writable dirs.
        // compileSdk stays 35 because the v3 WebView host needs modern APIs.
        //
        // Play Store implication: targetSdk < 34 cannot ship on Google Play
        // (Play requires targeting a recent API level). This APK is therefore
        // distributed sideload / GitHub-release only, which matches this
        // project's distribution model. Revisit only if a bundled-engine
        // (non-exec-from-data) build mode is ever added.
        targetSdk 28
        // versionName/versionCode are injected from core/VERSION by the
        // Taskfile android:build task (-PversionName / -PversionCode;
        // versionCode = major*10000 + minor*100 + patch, so each release
        // outranks the previous one — Android refuses update installs whose
        // versionCode is not higher). The static values below are only a
        // fallback for bare `gradlew` runs.
        versionName (project.findProperty('versionName') ?: "0.3.9")
        versionCode (project.hasProperty('versionCode')
            ? (project.property('versionCode') as String).toInteger() : 1)

        // ABI selection: defaults to arm64-v8a (the release APK for real
        // devices). CI's emulator smoke passes -PtargetAbi=x86_64 to package
        // a second debug APK for the x86_64 CI emulator (which cannot run
        // arm64 native libs). Comma-separated values are accepted.
        // Property assignment (not a method call): NdkOptions.abiFilters is a
        // Set<String> field — a Groovy method call with a List argument does
        // not resolve.
        def targetAbis = ((project.findProperty("targetAbi") ?: "arm64-v8a").split(",").collect { it.trim() }) as Set
        ndk {
            abiFilters = targetAbis
        }
    }

    // Stable release signing sources, in priority order: ANDROID_KEYSTORE_*
    // environment variables (CI: GitHub Actions secrets) then a gitignored
    // keystore.properties at the gradle project root (build/android/,
    // local builds, same key names).
    // Without either, release builds fall back to the auto-generated debug
    // keystore so they stay installable for testing — but Android only lets
    // an APK replace an installed one with the SAME signature, so released
    // APKs must always come from the stable keystore for the in-app
    // self-update to work.
    def ksProps = new Properties()
    // Resolved from the gradle PROJECT ROOT (build/android/, next to gradlew),
    // not the app module dir.
    def ksPropsFile = rootProject.file('keystore.properties')
    if (ksPropsFile.exists()) {
        ksPropsFile.withInputStream { ksProps.load(it) }
    }
    def signingEnv = { String name ->
        def v = System.getenv(name)
        (v != null && !v.trim().isEmpty()) ? v : ksProps.getProperty(name)
    }
    def keystoreFile = signingEnv('ANDROID_KEYSTORE_FILE')
    def hasKeystore = keystoreFile != null && !keystoreFile.trim().isEmpty()

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(keystoreFile)
                storePassword signingEnv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias signingEnv('ANDROID_KEY_ALIAS')
                keyPassword signingEnv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    lint {
        // Release builds run lintVital; ExpiredTargetSdkVersion fires on the
        // deliberate targetSdk 28 (see defaultConfig above: exec() W^X
        // exemption for the runtime-downloaded llama-server; this APK is
        // sideload-only, never Play-distributed).
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Source sets configuration
    sourceSets {
        main {
            // JNI libraries are in jniLibs folder
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Assets for the WebView
            assets.srcDirs = ['src/main/assets']
        }
    }

    // Packaging options
    packagingOptions {
        // Don't strip Go symbols in debug builds
        doNotStrip '*/arm64-v8a/libwails.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // In-app QR scanner (QrScanActivity, LAN pairing import): CameraX for the
    // preview + analysis pipeline, ML Kit's bundled barcode model (offline,
    // no Play Services dependency, QR-only via BarcodeScannerOptions).
    // 1.2.3 fits the project's androidx line (appcompat 1.6.1 era) and needs
    // compileSdk 33 — the project already builds with 35 — and minSdk 21.
    implementation 'androidx.camera:camera-camera2:1.2.3'
    implementation 'androidx.camera:camera-lifecycle:1.2.3'
    implementation 'androidx.camera:camera-view:1.2.3'
    implementation 'com.google.mlkit:barcode-scanning:16.1.1'
}
